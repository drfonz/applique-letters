name: Release core package

on:
  push:
    tags: ["core-v*"]

permissions:
  contents: read
  # npm trusted publishing: npm exchanges this OIDC token for a short-lived publish token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check the tag matches the package version
        run: test "core-v$(node -p 'require("./packages/core/package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish -w @indigolabsltd/applique-core
